[package]
name = "nm-dedupe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Reclaim disk space from duplicate node_modules files with APFS clones, without losing a byte"
license = "MIT"
repository = "https://github.com/michaellocher/nm-dedupe"
homepage = "https://michaellocher.github.io/nm-dedupe/"
readme = "README.md"
keywords = ["node_modules", "apfs", "dedupe", "disk-space", "macos"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
libc = "0.2.191"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.11.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

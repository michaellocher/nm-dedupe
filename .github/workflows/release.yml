name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Tag matches Cargo.toml version
        run: test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$GITHUB_REF_NAME"
      - run: cargo test --release
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/nm-dedupe \
            target/aarch64-apple-darwin/release/nm-dedupe \
            target/x86_64-apple-darwin/release/nm-dedupe
          lipo -info dist/nm-dedupe
      - name: Package
        run: |
          name="nm-dedupe-macos-universal"
          tar -czf "dist/$name.tar.gz" -C dist nm-dedupe
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Release notes
        run: |
          .github/scripts/changelog.sh "$GITHUB_REF_NAME" > dist/notes.md
          printf '\n**SHA-256:** `%s`\n' "$(cut -d' ' -f1 dist/*.sha256)" >> dist/notes.md
          cat dist/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
